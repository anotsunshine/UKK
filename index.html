<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Judul Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 id="NamaToko">Nama Toko</h1>
    </header>
<section class="produk">
    <article class="produk">
        <img src="images.jpg" alt="Nama Barang">
        <div class="card">
        <h4>Produk 1</h4>
        <p>Harga Rp80.000</p>
        </div>
    </article>
    <article class="produk">
        <img src="images.jpg" alt="Nama Barang">
        <div class="card">
        <h4>Produk 2</h4>
        <p>Harga Rp90.000</p>
        </div>
    </article>
    <article class="produk">
        <img src="images.jpg" alt="Nama Barang">
        <div class="card">
            <h4>Produk 3</h4>
            <p>Harga Rp75.000</p>
        </div>
    </article>
</section>
    <form id="formPesan" action="#" method="get">
        <h2>Form Pemesanan</h2>
    <label for="nama">Nama Pemesan</label>
    <input type="text" id="nama" name="nama" pattern="[A-Za-z\s]+" required>

    <label for="hp">Nomor HP</label>
    <input type="tel" id="hp" name="hp" pattern="[0-9]+" inputmode="numeric" required>

    <label for="produk">Produk</label>
    <select id="produk" name="produk" required>
        <option value="">-- Pilih --</option>
        <option value="produk-1">Produk 1</option>
        <option value="produk-2">Produk 2</option>
        <option value="produk-3">Produk 3</option>
    </select>

    <label for="jumlah">Jumlah</label>
    <input type="number" id="jumlah" name="jumlah" required min="10" max="13">

    <fieldset>
        <legend>Metode Bayar</legend>
        <input type="radio" id="transfer" name="bayar" value="Transfer">
        <label for="transfer">Transfer</label>
        <input type="radio" id="cod" name="bayar" value="COD">
        <label for="cod">COD</label>
    </fieldset>

    <label for="alamat">Alamat</label>
    <textarea id="alamat" name="alamat"></textarea>

    <button type="submit">Pesan</button>
    </form>
    <footer>
        @nama Toko
    </footer>
</body>
</html>
